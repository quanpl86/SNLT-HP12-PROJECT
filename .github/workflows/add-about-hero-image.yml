name: Add GPT Image to About page
on:
  push:
    paths:
      - .github/workflows/add-about-hero-image.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download GPT Image transfer
        env:
          ASSET_URL: https://at.adobe.com/xHLFw9FrLsRmkiQu
        run: |
          curl -fsSL --retry 2 --max-time 90 "$ASSET_URL" -o /tmp/sac-viet-generated.png
          file /tmp/sac-viet-generated.png
          test "$(stat -c%s /tmp/sac-viet-generated.png)" -gt 100000
      - name: Crop to Hội An illustration for About
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 - <<'PY'
          from PIL import Image
          im = Image.open('/tmp/sac-viet-generated.png').convert('RGB')
          assert im.width >= 1728 and im.height >= 800, im.size
          # Chỉ lấy cảnh quan phía bên phải, loại phần chữ và nút giao diện AI dựng.
          im = im.crop((850, 160, 1728, 692))
          im.resize((1200, 728), Image.Resampling.LANCZOS).save('assets/about-hoian-gpt.webp', 'WEBP', quality=88, method=6)
          PY
          test -s assets/about-hoian-gpt.webp
      - name: Commit site image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/about-hoian-gpt.webp
          git diff --cached --quiet && exit 0
          git commit -m "assets: add GPT Image illustration for About page"
          git push
