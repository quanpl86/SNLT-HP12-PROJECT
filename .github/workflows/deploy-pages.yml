name: Publish Sac Viet to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "styles/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Package only the finished HP12 website
        run: |
          mkdir -p _site
          cp index.html about.html post.html editor.html dashboard.html _site/
          cp -R styles scripts assets _site/
          touch _site/.nojekyll
          test -f _site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
