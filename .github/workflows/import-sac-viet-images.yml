name: Import 7 GPT Image Sắc Việt pictures
on:
  push:
    paths:
      - ".github/workflows/import-sac-viet-images.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Transfer original approved GPT Image artworks (WebP)
        run: |
          mkdir -p assets/photos
          curl -fsSL --retry 3 --retry-delay 2 --max-time 120 'https://at.adobe.com/3dvhfNsov5bBapm0' -o assets/photos/viet-nam-hero-gpt.webp
          test "$(stat -c%s assets/photos/viet-nam-hero-gpt.webp)" -gt 30000
          file assets/photos/viet-nam-hero-gpt.webp
          curl -fsSL --retry 3 --retry-delay 2 --max-time 120 'https://at.adobe.com/705MEzB3WBtECev2' -o assets/photos/hoi-an-gpt.webp
          test "$(stat -c%s assets/photos/hoi-an-gpt.webp)" -gt 30000
          file assets/photos/hoi-an-gpt.webp
          curl -fsSL --retry 3 --retry-delay 2 --max-time 120 'https://at.adobe.com/XZmBvk84Cl2KTmgB' -o assets/photos/hue-gpt.webp
          test "$(stat -c%s assets/photos/hue-gpt.webp)" -gt 30000
          file assets/photos/hue-gpt.webp
          curl -fsSL --retry 3 --retry-delay 2 --max-time 120 'https://at.adobe.com/TNY2MUwERIOEXvRN' -o assets/photos/ha-long-cat-ba-gpt.webp
          test "$(stat -c%s assets/photos/ha-long-cat-ba-gpt.webp)" -gt 30000
          file assets/photos/ha-long-cat-ba-gpt.webp
          curl -fsSL --retry 3 --retry-delay 2 --max-time 120 'https://at.adobe.com/VrRtF06fazrU767R' -o assets/photos/trang-an-gpt.webp
          test "$(stat -c%s assets/photos/trang-an-gpt.webp)" -gt 30000
          file assets/photos/trang-an-gpt.webp
          curl -fsSL --retry 3 --retry-delay 2 --max-time 120 'https://at.adobe.com/XO0SEC1iO9o9Tw8x' -o assets/photos/mua-roi-nuoc-gpt.webp
          test "$(stat -c%s assets/photos/mua-roi-nuoc-gpt.webp)" -gt 30000
          file assets/photos/mua-roi-nuoc-gpt.webp
          curl -fsSL --retry 3 --retry-delay 2 --max-time 120 'https://at.adobe.com/pjA1WzTnOiU0ffb6' -o assets/photos/ao-dai-gpt.webp
          test "$(stat -c%s assets/photos/ao-dai-gpt.webp)" -gt 30000
          file assets/photos/ao-dai-gpt.webp
      - name: Verify WebP images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          paths=list(Path("assets/photos").glob("*-gpt.webp"))
          assert len(paths)==7, f"Expected 7 new images, got {len(paths)}"
          for p in paths:
              with Image.open(p) as img:
                  img.verify()
              with Image.open(p) as img:
                  assert img.width>=1200 and img.height>=670, (p,img.size)
              print("PASS",p,p.stat().st_size)
          PY
      - name: Commit approved images to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photos/
          if git diff --cached --quiet; then
            echo "Images already present"; exit 0
          fi
          git commit -m "assets: add GPT Image hero and six Viet Nam culture illustrations"
          git push
